<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <defs>
    <linearGradient id="p3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#141c2e" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="12" fill="url(#p3-bg)" />
  <circle cx="500" cy="90" r="120" fill="#3b82f6" opacity="0.07" />

  <!-- App Window -->
  <g transform="translate(50, 40)">
    <rect width="500" height="280" rx="10" fill="#0d1424" stroke="#334155" stroke-width="1.5" />
    <!-- Header -->
    <rect width="500" height="36" rx="10" fill="#131e33" />
    <circle cx="20" cy="18" r="4.5" fill="#ef4444" opacity="0.8" />
    <circle cx="34" cy="18" r="4.5" fill="#f59e0b" opacity="0.8" />
    <circle cx="48" cy="18" r="4.5" fill="#10b981" opacity="0.8" />
    <text x="250" y="22" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">CampusPulse — NST Tech Student Hub</text>

    <!-- Sidebar Mini -->
    <rect x="14" y="48" width="80" height="218" rx="6" fill="#090e1a" />
    <rect x="24" y="60" width="60" height="8" rx="3" fill="#38bdf8" />
    <rect x="24" y="78" width="50" height="6" rx="2" fill="#475569" />
    <rect x="24" y="94" width="45" height="6" rx="2" fill="#475569" />
    <rect x="24" y="110" width="55" height="6" rx="2" fill="#475569" />
    <rect x="24" y="126" width="40" height="6" rx="2" fill="#475569" />

    <!-- Content Area -->
    <!-- Top Stat Cards -->
    <g transform="translate(106, 48)">
      <rect width="118" height="60" rx="6" fill="#111a2e" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="22" fill="#94a3b8" font-size="10" font-family="system-ui">Python Projects</text>
      <text x="12" y="46" fill="#38bdf8" font-size="18" font-family="system-ui" font-weight="700">12 Done</text>

      <rect x="130" width="118" height="60" rx="6" fill="#111a2e" stroke="#1e293b" stroke-width="1" />
      <text x="142" y="22" fill="#94a3b8" font-size="10" font-family="system-ui">Weekly Study Log</text>
      <text x="142" y="46" fill="#34d399" font-size="18" font-family="system-ui" font-weight="700">28.5 hrs</text>

      <rect x="260" width="118" height="60" rx="6" fill="#111a2e" stroke="#1e293b" stroke-width="1" />
      <text x="272" y="22" fill="#94a3b8" font-size="10" font-family="system-ui">Semester Status</text>
      <text x="272" y="46" fill="#f59e0b" font-size="18" font-family="system-ui" font-weight="700">Sem 1 • NST</text>
    </g>

    <!-- Chart / Progress area -->
    <g transform="translate(106, 120)">
      <rect width="378" height="146" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="24" fill="#cbd5e1" font-size="11" font-family="system-ui" font-weight="600">Learning Curve &amp; Coding Consistency</text>
      <!-- Chart line -->
      <path d="M20 120 L70 95 L130 105 L190 70 L250 80 L310 40 L360 30" stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round" />
      <path d="M20 120 L70 95 L130 105 L190 70 L250 80 L310 40 L360 30 L360 130 L20 130 Z" fill="url(#chartGrad)" />
      <!-- Points -->
      <circle cx="70" cy="95" r="3.5" fill="#34d399" />
      <circle cx="190" cy="70" r="3.5" fill="#34d399" />
      <circle cx="310" cy="40" r="3.5" fill="#34d399" />
      <circle cx="360" cy="30" r="4.5" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />
    </g>
  </g>
</svg>
