<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <defs>
    <linearGradient id="p2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="12" fill="url(#p2-bg)" />
  <!-- UI Grid Pattern -->
  <circle cx="150" cy="80" r="140" fill="#06b6d4" opacity="0.08" />
  <circle cx="450" cy="280" r="160" fill="#818cf8" opacity="0.08" />
  
  <!-- Editor + Live Canvas Split -->
  <g transform="translate(40, 40)">
    <!-- Main Window -->
    <rect width="520" height="280" rx="10" fill="#0d1322" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />
    <!-- Header -->
    <rect width="520" height="34" rx="10" fill="#131c31" />
    <circle cx="20" cy="17" r="4.5" fill="#ef4444" opacity="0.8" />
    <circle cx="34" cy="17" r="4.5" fill="#f59e0b" opacity="0.8" />
    <circle cx="48" cy="17" r="4.5" fill="#10b981" opacity="0.8" />
    <text x="260" y="21" fill="#94a3b8" font-size="11" font-family="monospace" text-anchor="middle">StyleCraft — Modern CSS Playground</text>
    
    <!-- Left: CSS Code Block -->
    <rect x="18" y="50" width="230" height="210" rx="6" fill="#090d18" stroke="#1e293b" stroke-width="1" />
    <text x="28" y="74" fill="#38bdf8" font-size="11" font-family="monospace">.card-grid {</text>
    <text x="40" y="94" fill="#f43f5e" font-size="11" font-family="monospace">  display: <tspan fill="#e2e8f0">grid;</tspan></text>
    <text x="40" y="114" fill="#f43f5e" font-size="11" font-family="monospace">  grid-template-columns:</text>
    <text x="52" y="132" fill="#34d399" font-size="10" font-family="monospace">    repeat(auto-fit, minmax(180px, 1fr));</text>
    <text x="40" y="152" fill="#f43f5e" font-size="11" font-family="monospace">  gap: <tspan fill="#fbbf24">1.5rem;</tspan></text>
    <text x="40" y="172" fill="#f43f5e" font-size="11" font-family="monospace">  backdrop-filter: <tspan fill="#c084fc">blur(12px);</tspan></text>
    <text x="40" y="192" fill="#f43f5e" font-size="11" font-family="monospace">  transition: <tspan fill="#38bdf8">transform 0.3s;</tspan></text>
    <text x="28" y="214" fill="#38bdf8" font-size="11" font-family="monospace">}</text>
    <rect x="28" y="232" width="60" height="18" rx="3" fill="#0284c7" opacity="0.4" />
    <text x="58" y="244" fill="#7dd3fc" font-size="9" font-family="monospace" text-anchor="middle">CSS3 / Grid</text>

    <!-- Right: Live Rendered Cards -->
    <rect x="264" y="50" width="238" height="210" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
    <text x="276" y="72" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" font-weight="600">LIVE PREVIEW (FLEX &amp; GRID)</text>
    
    <!-- Mini UI card 1 -->
    <rect x="276" y="86" width="105" height="70" rx="6" fill="rgba(30, 41, 59, 0.7)" stroke="#38bdf8" stroke-width="1" />
    <rect x="286" y="96" width="40" height="6" rx="2" fill="#38bdf8" />
    <rect x="286" y="108" width="80" height="4" rx="2" fill="#64748b" />
    <rect x="286" y="118" width="65" height="4" rx="2" fill="#475569" />
    <circle cx="365" cy="142" r="6" fill="#10b981" />

    <!-- Mini UI card 2 -->
    <rect x="390" y="86" width="102" height="70" rx="6" fill="rgba(30, 41, 59, 0.7)" stroke="#818cf8" stroke-width="1" />
    <rect x="400" y="96" width="35" height="6" rx="2" fill="#818cf8" />
    <rect x="400" y="108" width="75" height="4" rx="2" fill="#64748b" />
    <rect x="400" y="118" width="55" height="4" rx="2" fill="#475569" />
    <circle cx="475" cy="142" r="6" fill="#6366f1" />

    <!-- Mini UI card 3 (full width) -->
    <rect x="276" y="168" width="216" height="78" rx="6" fill="rgba(30, 41, 59, 0.8)" stroke="#10b981" stroke-width="1" />
    <rect x="288" y="180" width="80" height="7" rx="2" fill="#34d399" />
    <rect x="288" y="194" width="180" height="5" rx="2" fill="#64748b" />
    <rect x="288" y="206" width="140" height="5" rx="2" fill="#475569" />
    <rect x="288" y="222" width="65" height="14" rx="3" fill="#10b981" />
    <text x="320" y="232" fill="#042f2e" font-size="8" font-family="system-ui" font-weight="700" text-anchor="middle">Interactive</text>
  </g>
</svg>
