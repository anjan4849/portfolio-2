<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <defs>
    <linearGradient id="p1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="p1-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="12" fill="url(#p1-bg)" />
  <!-- Grid lines -->
  <path d="M0 60 H600 M0 120 H600 M0 180 H600 M0 240 H600 M0 300 H600" stroke="#10b981" stroke-opacity="0.07" stroke-width="1" />
  <path d="M60 0 V360 M120 0 V360 M180 0 V360 M240 0 V360 M300 0 V360 M360 0 V360 M420 0 V360 M480 0 V360 M540 0 V360" stroke="#10b981" stroke-opacity="0.07" stroke-width="1" />
  
  <!-- Terminal Window Mockup -->
  <g transform="translate(60, 45)">
    <rect width="480" height="270" rx="10" fill="#090d16" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5" />
    <!-- Header -->
    <rect width="480" height="36" rx="10" fill="#131a29" />
    <circle cx="20" cy="18" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="36" cy="18" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="52" cy="18" r="5" fill="#10b981" opacity="0.8" />
    <text x="240" y="22" fill="#94a3b8" font-size="12" font-family="monospace" text-anchor="middle">pytask-cli — python3 main.py</text>
    
    <!-- Code / CLI lines -->
    <text x="24" y="66" fill="#10b981" font-size="13" font-family="monospace">$ python -m pytask run --priority high</text>
    <text x="24" y="92" fill="#e2e8f0" font-size="12" font-family="monospace">[✓] Initializing Task Engine v1.0.4</text>
    <text x="24" y="116" fill="#94a3b8" font-size="12" font-family="monospace">[✓] Connected to local JSON storage: data/tasks.json</text>
    
    <!-- Task table block -->
    <rect x="24" y="132" width="432" height="90" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="38" y="156" fill="#38bdf8" font-size="11" font-family="monospace">ID   TASK NAME                 STATUS    DEADLINE   PRIORITY</text>
    <line x1="38" y1="164" x2="442" y2="164" stroke="#334155" stroke-width="1" />
    <text x="38" y="184" fill="#34d399" font-size="11" font-family="monospace">#01  DSA Algorithm Practice    RUNNING   Today      HIGH</text>
    <text x="38" y="204" fill="#a78bfa" font-size="11" font-family="monospace">#02  CSS Flexbox Lab Module    DONE      Oct 28     MEDIUM</text>
    
    <!-- Status footer -->
    <rect x="24" y="234" width="220" height="24" rx="4" fill="#064e3b" opacity="0.7" />
    <text x="34" y="250" fill="#6ee7b7" font-size="11" font-family="monospace">● 1 active • 1 completed • 0 failed</text>
    <rect x="380" y="234" width="76" height="24" rx="4" fill="#1e293b" />
    <text x="418" y="250" fill="#38bdf8" font-size="11" font-family="monospace" text-anchor="middle">Python 3</text>
  </g>
</svg>
